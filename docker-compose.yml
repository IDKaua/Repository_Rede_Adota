version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: adota_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: rede_adota
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rede_adota"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: adota_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=password123
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=rede_adota
      - JWT_SECRET=chave_super_secreta_rede_adota
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: adota_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: